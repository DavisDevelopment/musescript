# Pipeline hardening CI — standing gates from PIPELINE_HARDENING_TODO.md
# Runs critical suites + JVM↔node DetParityDump byte-identity (Bucket D4).
name: pipeline-hardening

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly preferVm soak (optional regression). Push/PR still use required jobs only.
    - cron: "17 8 * * 1"

jobs:
  hardening-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          # Match local toolkit when possible; 4.3.6 is the stable CI fallback.
          haxe-version: 4.3.6

      - name: Install haxelib deps
        run: |
          haxelib install utest --quiet
          haxelib install hxnodejs --quiet

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ban .shift() in indicators/lib (OPEN_ITEMS 1.2)
        run: node tools/ban_indicator_shift.mjs

      - name: Build + run projection-host / hardening suite
        run: |
          haxe build-projection-host-tests.hxml
          node build/js/tests-projection-host.js

      - name: Build + run auction hardening suite
        run: |
          haxe build-auction-tests.hxml
          node build/js/tests-auction.js

      - name: Build + run bytecode VM parity gate (interp↔VM byte-identity)
        run: |
          haxe build-vm-parity.hxml
          node build/js/tests-vm-parity.js

      - name: Seed-restart matrix (bounded multi-CLI --seed)
        run: bash tools/seed_restart_matrix.sh

      - name: Planted co-evo on real tape (bounded)
        run: bash tools/planted_coevo.sh
        env:
          PLANTED_TAPE: corpus/tapes/spy_oos_2022_2026.csv
          PLANTED_GENS: "3"
          PLANTED_POP: "6"
          PLANTED_MAX_BARS: "900"

  # Aggregated op×engine honesty suites (ndarray / host-evo / pd / VM / book / portfolio / io).
  # See docs/ENGINE_MATRIX.md. Fail closed; prints suite names.
  engine-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install haxelib deps
        run: |
          haxelib install utest --quiet
          haxelib install hxnodejs --quiet

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Engine-matrix honesty gate
        run: bash tools/engine_matrix.sh

  # Optional preferVm regression soak — DetParity + vm-parity + Fitness.preferVm path.
  # preferVm defaults ON. continue-on-error so soak flakiness/slow fails never block merge.
  # Also runnable via workflow_dispatch / weekly schedule (see `on:`). See docs/ENGINE_MATRIX.md.
  prefer-vm-soak:
    # Manual / weekly only — not on every push/PR (required CI stays lean).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install haxelib deps
        run: |
          haxelib install utest --quiet
          haxelib install hxnodejs --quiet

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: preferVm soak (regression; default ON)
        run: bash tools/prefer_vm_soak.sh

  det-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          # Match local toolkit when possible; 4.3.6 is the stable CI fallback.
          haxe-version: 4.3.6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: DetParity JVM ↔ node ↔ golden
        run: bash tools/det_parity_ci.sh

  forecast-host-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install haxelib deps
        run: haxelib install hxnodejs --quiet

      - name: ForecastHostParity JVM ↔ node ↔ golden
        run: bash tools/forecast_host_parity_ci.sh

  equity-digest-web-app-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          # Prefer matching local toolkit; digests are Haxe-source stable, bundle hash is soft.
          haxe-version: 4.3.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build muse-runtime.js
        run: haxe build-runtime.hxml

      - name: EquityDigest web↔app ↔ golden
        # Full web+mobile accept locally: MUSE_PARITY_STRICT=1 (siblings present).
        # CI locks build digests to testdata golden (siblings usually absent).
        # Ship-protect obfuscated artifacts must NEVER feed this job — raw only.
        run: bash tools/equity_digest_web_app_parity_ci.sh
